<!DOCTYPE html>
<html>

<head>
    <title>{{ title or "Tickers Finder" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <h1>{{ title or "Tickers Finder" }}</h1>
    <div class="button-container">
        <a href="/enrich-tickers" class="btn disabled">Create Tickers DB</a>
        <a href="/enrich-tickers" class="btn disabled">Enrich Tickers DB</a>

        <form action="/create-candidate-db" method="post"
            style="display: flex; flex-direction: column; align-items: center;">
            <button type="submit" class="btn">Create Candidates DB</button>

            <div style="margin-top: 8px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <label for="marketcap" style="min-width: 120px; text-align: right;">Min Market Cap</label>
                    <input type="number" id="marketcap" name="marketcap"
                        value="{{ session.get('marketcap', 100000000000) }}"
                        style="padding: 6px; border-radius: 6px; border: 1px solid #ccc; width: 12ch;" required>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <label for="maxprice" style="min-width: 120px; text-align: right;">Max Price</label>
                    <input type="number" id="maxprice" name="maxprice" value="{{ session.get('maxprice', 120) }}"
                        style="padding: 6px; border-radius: 6px; border: 1px solid #ccc; width: 12ch;" required>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <label for="period" style="min-width: 120px; text-align: right;">Period</label>
                    <select id="period" name="period"
                        style="padding: 6px; border-radius: 6px; border: 1px solid #ccc; width: 12ch;" required>
                        <option value="1d">1d</option>
                        <option value="5d">5d</option>
                        <option value="1mo">1mo</option>
                        <option value="3mo">3mo</option>
                        <option value="6mo" selected>6mo</option>
                        <option value="1y">1y</option>
                        <option value="2y">2y</option>
                        <option value="5y">5y</option>
                        <option value="10y">10y</option>
                        <option value="ytd">YTD</option>
                        <option value="max">max</option>
                    </select>
                </div>

            </div>
        </form>


        <a href="/process-candidates-db" class="btn">Process Candidates DB</a>
        <a href="/sectors-performances" class="btn">Generate Sector Performances</a>
        <a href="/create-candidates-db-price-history" class="btn">Create Price History</a>
        <a href="/generate-graphs/live" class="btn">Generate Graphs</a>
    </div>

    {% block content %}{% endblock %}
</body>

</html>
